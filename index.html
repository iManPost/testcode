<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางคะแนนและผลบอลโลกอัปเดตอัตโนมัติ</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #0f172a;
color: #ffffff;
margin: 0;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
}
.container {
width: 100%;
max-width: 800px;
background: #1e293b;
padding: 20px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
h1 {
text-align: center;
font-size: 24px;
color: #38bdf8;
margin-bottom: 20px;
}
.update-info {
text-align: center;
font-size: 12px;
color: #94a3b8;
margin-top: 15px;
}
</style>
</head>
<body>

<div class="container">
<h1>🏆 สกอร์และตารางคะแนนฟุตบอลโลก อัปเดตสด</h1>

<!-- ส่วนแสดง Widget ผลบอล/ตารางคะแนนอัตโนมัติ -->
<!-- ข้อมูลจะถูกดึงผ่านสคริปต์และอัปเดตแบบอัตโนมัติทุกวันตลอดทัวร์นาเมนต์ -->
<div id="scoreaxis-widget-745bf" data-widget="scoreaxis-widget-preview" style="width:100%; border:none; transition:all 300ms ease-in-out;">
<iframe id="sa-iframe-745bf" src="https://scoreaxis.com" style="width: 100%; border: none; transition: all 300ms ease-in-out; min-height: 500px;"></iframe>
</div>

<div class="update-info">ข้อมูลอัปเดตอัตโนมัติ 24 ชั่วโมงจากระบบ Live Feed</div>
</div>

<script>
// สคริปต์ควบคุมการปรับขนาดเฟรมอัตโนมัติเมื่อมีการโหลดฟีดข้อมูลใหม่
window.addEventListener("message", (function(e) {
if (e.data && "scoreaxis" === e.data.action && "resize" === e.data.type) {
var t = document.getElementById("sa-iframe-" + e.data.widgetId);
if (t) { t.style.height = e.data.height + "px"; }
}
}));
</script>

</body>
</html>
